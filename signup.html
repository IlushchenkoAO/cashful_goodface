<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in or sign up · Cashful</title>
  <!-- Log in and sign up are one entry now: auth.html. This page only forwards, keeping the query (?type=, ?ref=, ?state=…). -->
  <meta http-equiv="refresh" content="0; url=auth.html">
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var page = location.pathname.split('/').pop();
      if (page === 'signup-developer.html' && !q.has('type')) q.set('type', 'developer');
      if (page === 'signup.html' && !q.has('type')) q.set('type', 'peer');
      var s = q.toString();
      location.replace('auth.html' + (s ? '?' + s : ''));
    })();
  </script>
</head>
<body><p><a href="auth.html">Continue to Cashful</a></p></body>
</html>
