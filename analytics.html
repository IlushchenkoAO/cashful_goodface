<body data-page="analytics" data-account="auto">

       Filters live in the URL: ?app=<id|all>&period=7d|30d|90d|custom&from=&to=&metric=nodes|ips|earnings&groupBy=day|app|platform&split=1
       Demo data: &data=data|no-apps|none-active|no-data|empty-period|loading|error. Nothing here depends on KYC. -->

    <aside class="cf-sidebar" data-sidebar data-active="analytics"></aside>
